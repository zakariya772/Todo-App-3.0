<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
  name="description"
  content="A simple and intuitive todo app for organizing tasks, tracking progress, and staying productive."
/>
  <title>Todo App 3.0 — Organize Your Tasks</title>
  <link rel="stylesheet" href="./style.css">
  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png">

  <!-- Apple -->
  <link rel="apple-touch-icon" sizes="180x180" href="./favicon-apple--180.png">

  <!-- Android -->
  <link rel="icon" type="image/png" sizes="192x192" href="./favicon-andriod--192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./favicon-icon--512.png">

  <!-- Web App Manifest -->
  <link rel="manifest" href="site.webmanifest">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
</head>

<body>
  <div class="todo-app">

    <h1 class="heading-primary">Todo App <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" class="book-open__icon">
        <path d="M12 5v16" />
        <path
          d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z" />
      </svg></h1>

    <div class="input-area">
      <input type="text" class="task-input" placeholder="Add a new task">
      <button class="add-btn">Add Task</button>
    </div>

    <ul class="task-list">
      <!-- Tasks will appear here -->
    </ul>

    <p class="empty-state">
      No tasks yet
    </p>

    <div class="footer">

      <span class="task-count">
        0 tasks left
      </span>

      <div class="filters">
        <div class="filters__container">
          <button class="filters__btn all clicked filters-clicked">All</button>
          <button class="filters__btn active">Active</button>
          <button class="filters__btn completed">Completed</button>
        </div>
        <button class="filters__btn clear">Clear Completed</button>
      </div>

    </div>

  </div>
  <script defer src="./script.js"></script>
</body>

</html>
